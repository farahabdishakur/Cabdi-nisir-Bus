# Production: Caddy (HTTPS) + API + PostgreSQL. Isticmaal: docker compose -f docker-compose.prod.yml up -d --build
# .env waa in uu leeyahay: NODE_ENV=production, JWT_* cusub, POSTGRES_PASSWORD, CORS_ORIGIN, SMS_*, API_DOMAIN
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cabdinasir_bus
    volumes: [pgdata:/var/lib/postgresql/data]
    # port lama soo bandhigo internet-ka
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cb -d cabdinasir_bus"]
      interval: 10s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://cb:${POSTGRES_PASSWORD}@db:5432/cabdinasir_bus?schema=public
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

volumes:
  pgdata:
  uploads:
  caddy_data:
