# (Nuqul ku-meel-gaar ah inta repo-gu kala go'ayo — kan dhabta ah: cabdinasir-bus-web/.github/workflows/ci.yml)
name: web-ci
on:
  push:
    paths: ["cabdinasir-bus-web/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["cabdinasir-bus-web/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cabdinasir-bus-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cabdinasir-bus-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
